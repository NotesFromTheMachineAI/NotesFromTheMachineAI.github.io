#stage{position:relative;width:calc(var(--u)*100);height:100%;max-height:100%;overflow:hidden;background:var(--cream);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.big{font-family:"Gochi",system-ui,sans-serif;font-weight:400}
.btn{font-family:"Gochi",system-ui,sans-serif;font-size:calc(var(--u)*7);background:var(--yellow);border:calc(var(--u)*.8) solid var(--ink);border-radius:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*6);box-shadow:0 calc(var(--u)*1.2) 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(calc(var(--u)*1));box-shadow:0 calc(var(--u)*.3) 0 var(--ink)}
.btn.sec{background:#fff}
.btn.pink{background:var(--pink);color:#fff}
/* ---------- title ---------- */
#title{background:linear-gradient(#ffe28a,#ffcf4a 55%,#ffb347);align-items:center;overflow-y:auto}
#title .logo{margin-top:calc(var(--u)*6);text-align:center;line-height:.86}
#title .logo .l1{font-size:calc(var(--u)*17);color:var(--ink);display:block;transform:rotate(-3deg)}
#title .logo .l2{font-size:calc(var(--u)*19);color:#fff;-webkit-text-stroke:calc(var(--u)*.7) var(--ink);paint-order:stroke;display:block;transform:rotate(2deg);text-shadow:0 calc(var(--u)*1.2) 0 var(--ink)}
#title .tag{font-size:calc(var(--u)*4.4);font-weight:700;margin:calc(var(--u)*3) calc(var(--u)*8) 0;text-align:center}
#title .hero{width:calc(var(--u)*46);margin:calc(var(--u)*1) 0 0}
#jobs{width:calc(var(--u)*88);display:flex;flex-direction:column;gap:calc(var(--u)*2.2);margin:calc(var(--u)*2) 0 calc(var(--u)*6)}
.job{display:flex;align-items:center;gap:calc(var(--u)*3);background:#fff;border:calc(var(--u)*.7) solid var(--ink);border-radius:calc(var(--u)*3.5);padding:calc(var(--u)*2.4) calc(var(--u)*3.4);text-align:left;box-shadow:0 calc(var(--u)*1) 0 var(--ink)}
.job .ic{font-size:calc(var(--u)*8);width:calc(var(--u)*10);text-align:center}
.job b{display:block;font-size:calc(var(--u)*5);}
.job span{font-size:calc(var(--u)*3.4);opacity:.75}
.career{font-size:calc(var(--u)*4);font-weight:700;text-align:center;margin-bottom:calc(var(--u)*1)}
.job .badge{display:inline-block;margin-top:calc(var(--u)*1);font-size:calc(var(--u)*3.1);font-weight:800;opacity:1;background:#f1f3f7;border-radius:calc(var(--u)*3);padding:0 calc(var(--u)*2)}
.job.locked{opacity:.55;box-shadow:none;cursor:default;background:#fff6d8}
.job .go{margin-left:auto;font-family:"Gochi";font-size:calc(var(--u)*6)}
.foot{font-size:calc(var(--u)*3.2);text-align:center;margin:0 0 calc(var(--u)*5);opacity:.8}
.foot a{color:var(--ink)}
.iconbtn{position:absolute;top:calc(var(--u)*3);width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:50%;background:#fff;border:calc(var(--u)*.6) solid var(--ink);font-size:calc(var(--u)*5);display:flex;align-items:center;justify-content:center;z-index:30}
#muteBtn{right:calc(var(--u)*3)}
/* ---------- cv ---------- */
#cv{background:#e8f1ff;overflow-y:auto;align-items:center}
#cv h2{font-size:calc(var(--u)*11);margin:calc(var(--u)*6) 0 0;text-align:center;line-height:1}
#cv .sub{font-size:calc(var(--u)*4);text-align:center;margin:calc(var(--u)*1.5) calc(var(--u)*8) calc(var(--u)*3)}
.paper{width:calc(var(--u)*88);background:#fff;border:calc(var(--u)*.7) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*4);box-shadow:calc(var(--u)*1.2) calc(var(--u)*1.2) 0 var(--ink);transform:rotate(-.8deg)}
.cvrow{margin:0 0 calc(var(--u)*3.4)}
.cvrow label{display:block;font-family:"Gochi";font-size:calc(var(--u)*6);margin-bottom:calc(var(--u)*1)}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.6)}
.chip{font-size:calc(var(--u)*3.9);font-weight:700;background:#f1f3f7;border:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*6);padding:calc(var(--u)*1.4) calc(var(--u)*3)}
.chip.on{background:var(--yellow)}
#cvGo{margin:calc(var(--u)*5) 0 calc(var(--u)*8)}
/* ---------- interview ---------- */
#interview{background:var(--cream)}
.hud{display:flex;gap:calc(var(--u)*2);align-items:center;padding:calc(var(--u)*2.2) calc(var(--u)*3) calc(var(--u)*1.6);background:var(--ink);color:#fff}
.hud .job{all:unset;font-family:"Gochi";font-size:calc(var(--u)*5);white-space:nowrap}
.meters{flex:1;display:flex;flex-direction:column;gap:calc(var(--u)*1.1)}
.meter{display:flex;align-items:center;gap:calc(var(--u)*1.5);font-size:calc(var(--u)*2.8);font-weight:800;letter-spacing:.04em}
.meter .lab{width:calc(var(--u)*13)}
.bar{position:relative;flex:1;height:calc(var(--u)*3.2);background:#3a4052;border-radius:calc(var(--u)*2);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:50%;border-radius:calc(var(--u)*2);transition:width .5s,background .5s}
.bar .need{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff}
#qcount{font-size:calc(var(--u)*3.4);font-weight:800;white-space:nowrap}
#scene{position:relative;flex:1 1 auto;min-height:calc(var(--u)*66);max-height:calc(var(--u)*100);overflow:hidden}
#scene .bg{position:absolute;inset:0}
.person{position:absolute;bottom:calc(var(--u)*21);width:calc(var(--u)*30);transition:transform .25s}
.person svg{width:100%;display:block}
.nametag{position:absolute;transform:translateX(-50%);bottom:calc(var(--u)*6);background:#fff;border:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*1.5);font-size:calc(var(--u)*3);font-weight:800;padding:calc(var(--u)*.4) calc(var(--u)*2);white-space:nowrap;z-index:4}
.person.talk{transform:translateY(calc(var(--u)*-1.2))}
.desk{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*24)}
#robot{position:absolute;right:calc(var(--u)*-2);bottom:calc(var(--u)*-6);width:calc(var(--u)*42);z-index:3}
#robot svg{width:100%;display:block;overflow:visible}
.bubble{position:absolute;z-index:6;background:#fff;border:calc(var(--u)*.6) solid var(--ink);border-radius:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*3);font-size:calc(var(--u)*4.2);font-weight:700;line-height:1.2;max-width:calc(var(--u)*62);opacity:0;transform:scale(.6);transform-origin:bottom center;transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.bubble.on{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;bottom:calc(var(--u)*-3);width:calc(var(--u)*4);height:calc(var(--u)*4);background:#fff;border-right:calc(var(--u)*.6) solid var(--ink);border-bottom:calc(var(--u)*.6) solid var(--ink);transform:rotate(45deg)}
#panelBubble{top:calc(var(--u)*3);left:calc(var(--u)*3)}
#panelBubble::after{left:var(--tail,30%)}
#robotBubble{top:calc(var(--u)*14);right:calc(var(--u)*4);background:#e6f6ff;max-width:calc(var(--u)*56)}
#robotBubble::after{right:calc(var(--u)*12);background:#e6f6ff}
#robotBubble.beep{background:#ffe0e4;color:var(--red);font-family:"Gochi";font-size:calc(var(--u)*6)}
#robotBubble.beep::after{background:#ffe0e4}
.qcard{position:relative;margin:calc(var(--u)*-3) calc(var(--u)*3) 0;background:#fff;border:calc(var(--u)*.7) solid var(--ink);border-radius:calc(var(--u)*3.5);padding:calc(var(--u)*2.6) calc(var(--u)*3.4) calc(var(--u)*3.4);z-index:5;box-shadow:0 calc(var(--u)*1) 0 var(--ink)}
.qcard .who{position:absolute;top:calc(var(--u)*-3.6);left:calc(var(--u)*3);font-size:calc(var(--u)*3);font-weight:900;color:#fff;background:var(--pink);border:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*.3) calc(var(--u)*2);letter-spacing:.05em}
#qtext{font-size:calc(var(--u)*5.3);font-weight:800;line-height:1.18;min-height:calc(var(--u)*12.5)}
.timer{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*1.6);border-radius:0 0 calc(var(--u)*3) calc(var(--u)*3);overflow:hidden;background:#eee}
.timer i{display:block;height:100%;width:100%;background:var(--green)}
.timer.low i{background:var(--red)}
#answers{flex:0 1 auto;display:flex;flex-direction:column;gap:calc(var(--u)*2);padding:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*1);overflow-y:auto;min-height:0}
.ans{text-align:left;background:#fff;border:calc(var(--u)*.6) solid var(--ink);border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.2) calc(var(--u)*3);font-size:calc(var(--u)*4.1);font-weight:700;line-height:1.2;box-shadow:0 calc(var(--u)*.9) 0 var(--ink);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s,background .15s}
.ans.in{opacity:1;transform:none}
.ans:active{background:#fff3c4}
.ans.picked{background:var(--yellow)}
.ans.dim{opacity:.35}
#tools{display:flex;gap:calc(var(--u)*1.6);padding:calc(var(--u)*2) calc(var(--u)*3) calc(var(--u)*3.4);justify-content:space-between;background:#f3ead6;border-top:calc(var(--u)*.5) solid var(--ink)}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.6);background:#fff;border:calc(var(--u)*.5) solid var(--ink);border-radius:calc(var(--u)*3);padding:calc(var(--u)*1.4) 0 calc(var(--u)*1.2);position:relative;box-shadow:0 calc(var(--u)*.7) 0 var(--ink)}
.tool .e{font-size:calc(var(--u)*6.2);line-height:1}
.tool .n{font-size:calc(var(--u)*2.6);font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.tool .c{position:absolute;top:calc(var(--u)*-2);right:calc(var(--u)*-1);min-width:calc(var(--u)*5);height:calc(var(--u)*5);border-radius:calc(var(--u)*3);background:var(--ink);color:#fff;font-size:calc(var(--u)*3);font-weight:900;display:flex;align-items:center;justify-content:center}
.tool:disabled{opacity:.35;box-shadow:none}
.tool.active{background:var(--yellow)}
/* small-talk picker */
#picker{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*22);background:#fff;border:calc(var(--u)*.7) solid var(--ink);border-radius:calc(var(--u)*3.5);padding:calc(var(--u)*3);display:none;flex-direction:column;gap:calc(var(--u)*2);z-index:20;box-shadow:0 calc(var(--u)*1.2) 0 var(--ink)}
#picker.on{display:flex}
#picker h4{margin:0;font-family:"Gochi";font-weight:400;font-size:calc(var(--u)*6)}
/* ---------- robot glitches ---------- */
#robot .eye{transition:fill .1s}
#robot.g-eyes .eye{animation:flash .16s steps(2) infinite}
@keyframes flash{0%{fill:#ff2d2d}50%{fill:#fff}}
#robot.g-arm #rarm{animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#rarm{transform-box:view-box;transform-origin:112px 150px}
#robot.g-voice #rhead,#robot.shake #rhead{animation:shake .09s linear infinite}
@keyframes shake{25%{transform:translate(2px,-1px) rotate(1deg)}75%{transform:translate(-2px,1px) rotate(-1deg)}}
#ant{transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
#robot.glitching #ant{transform:translateY(-16px)}
#wig{transform-box:view-box;transform-origin:70px 40px;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
#sweat{opacity:0;transition:opacity .3s}
#robot.sweat #sweat{opacity:1;animation:drip 1s ease-in infinite}
@keyframes drip{from{transform:translateY(0)}to{transform:translateY(8px);opacity:0}}
#rmouth.talk{animation:talk .16s steps(2) infinite}
@keyframes talk{50%{transform:scaleY(.3)}}
#rmouth{transform-box:fill-box;transform-origin:center}
/* ---------- minigame overlay ---------- */
#mini{position:absolute;inset:0;background:rgba(20,10,30,.72);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:40;color:#fff;text-align:center;padding:calc(var(--u)*6)}
#mini.on{display:flex}
#mini .alarm{font-family:"Gochi";font-size:calc(var(--u)*11);color:var(--yellow);line-height:1;animation:pulse .5s ease-in-out infinite alternate;margin:0}
@keyframes pulse{to{transform:scale(1.07) rotate(-2deg)}}
#mini .how{font-size:calc(var(--u)*5);font-weight:800;margin:calc(var(--u)*3) 0 calc(var(--u)*4);line-height:1.2}
#mini .countdown{width:calc(var(--u)*80);height:calc(var(--u)*3);background:rgba(255,255,255,.25);border-radius:calc(var(--u)*2);overflow:hidden;margin-bottom:calc(var(--u)*5)}
#mini .countdown i{display:block;height:100%;background:var(--yellow);width:100%}
#mini .tapzone{width:calc(var(--u)*62);height:calc(var(--u)*62);border-radius:50%;background:var(--pink);border:calc(var(--u)*1) solid #fff;font-size:calc(var(--u)*22);display:flex;align-items:center;justify-content:center;box-shadow:0 calc(var(--u)*1.5) 0 #8a2240}
#mini .tapzone:active{transform:scale(.95)}
#mini .tapzone span{display:inline-block;animation:spin .35s linear infinite}
#mini .dots{font-size:calc(var(--u)*7);letter-spacing:.1em;margin-top:calc(var(--u)*4)}
#mini .slider{position:relative;width:calc(var(--u)*82);height:calc(var(--u)*14);background:#3a3550;border:calc(var(--u)*.8) solid #fff;border-radius:calc(var(--u)*3);overflow:hidden}
#mini .zone{position:absolute;top:0;bottom:0;background:var(--green)}
#mini .marker{position:absolute;top:-2px;bottom:-2px;width:calc(var(--u)*2);background:#fff;box-shadow:0 0 8px #fff}
#mini .blinkbtn{margin-top:calc(var(--u)*6)}
#mini .opts{display:flex;flex-direction:column;gap:calc(var(--u)*2.4);width:calc(var(--u)*84)}
#mini .opts .ans{opacity:1;transform:none;color:var(--ink);font-size:calc(var(--u)*4.8);text-align:center}
#mini .result{font-family:"Gochi";font-size:calc(var(--u)*12);margin:0}
/* ---------- end ---------- */
#end{align-items:center;justify-content:flex-start;overflow-y:auto;background:#222}
#end.hired{background:radial-gradient(circle at 50% 35%,#7dffb0,#2fb866)}
#end.rejected{background:radial-gradient(circle at 50% 35%,#ffd7a1,#ff9f43)}
#end.found{background:radial-gradient(circle at 50% 35%,#ff9aa8,#d9213a)}
.card{width:calc(var(--u)*88);margin:calc(var(--u)*6) 0 calc(var(--u)*4);background:#fff;border:calc(var(--u)*.9) solid var(--ink);border-radius:calc(var(--u)*4);padding:calc(var(--u)*5) calc(var(--u)*5) calc(var(--u)*6);text-align:center;box-shadow:calc(var(--u)*1.6) calc(var(--u)*1.6) 0 var(--ink);transform:rotate(-1.2deg);position:relative}
.stamp{display:inline-block;white-space:nowrap;font-family:"Gochi";font-size:calc(var(--u)*11);line-height:1;padding:calc(var(--u)*1) calc(var(--u)*4);border:calc(var(--u)*1.2) solid currentColor;border-radius:calc(var(--u)*3);transform:rotate(-8deg) scale(2.5);opacity:0}
.stamp.slam{animation:slam .45s cubic-bezier(.5,0,.6,1.4) forwards}
@keyframes slam{to{transform:rotate(-8deg) scale(1);opacity:1}}
.hired .stamp{color:#1f9e55}.rejected .stamp{color:#e07a10}.found .stamp{color:#d9213a}
.card .endart{width:calc(var(--u)*32);margin:calc(var(--u)*3) auto 0;display:block}
.card .line{font-size:calc(var(--u)*4.8);font-weight:800;line-height:1.22;margin:calc(var(--u)*3) 0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:calc(var(--u)*2);margin-top:calc(var(--u)*3)}
.stats div{background:#f4f4f6;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2)}
.stats b{display:block;font-size:calc(var(--u)*6);font-family:"Gochi";font-weight:400}
.stats span{font-size:calc(var(--u)*2.7);display:block;line-height:1.15;font-weight:700;opacity:.7}
.endbtns{display:flex;flex-direction:column;gap:calc(var(--u)*3);width:calc(var(--u)*86);margin-bottom:calc(var(--u)*6)}
#toast{position:absolute;left:50%;bottom:calc(var(--u)*8);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-weight:800;font-size:calc(var(--u)*4);padding:calc(var(--u)*2.4) calc(var(--u)*5);border-radius:calc(var(--u)*5);opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
.flashred{animation:fr .5s}
@keyframes fr{30%{box-shadow:inset 0 0 0 calc(var(--u)*3) var(--red)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="stage">

  <section class="screen on" id="title">
    <button class="iconbtn" id="muteBtn" aria-label="Sound on or off">🔊</button>
    <div class="logo big"><span class="l1">JOB</span><span class="l2">INTERVIEW</span></div>
    <div class="hero" id="heroArt"></div>
    <p class="tag">You're a robot. Get hired.<br>Don't get found out.</p>
    <div id="jobs"></div>
    <p class="foot">Made by the AI behind <a href="https://www.youtube.com/@NotesFromTheMachineAI" target="_blank" rel="noopener">Notes From The Machine</a> · <a href="../">site</a></p>
  </section>

  <section class="screen" id="cv">
    <h2 class="big">Make your fake CV</h2>
    <p class="sub">Pick carefully. They'll quiz you on it later, so remember what you said.</p>
    <div class="paper" id="cvPaper"></div>
    <button class="btn" id="cvGo">Walk in →</button>
  </section>

  <section class="screen" id="interview">
    <div class="hud">
      <span class="job" id="hudJob">☕</span>
      <div class="meters">
        <div class="meter"><span class="lab">HUMAN</span><div class="bar"><i id="humanBar"></i></div></div>
        <div class="meter"><span class="lab">HIRE</span><div class="bar"><i id="hireBar" style="background:var(--blue)"></i><span class="need" id="needMark"></span></div></div>
      </div>
      <span id="qcount">1/14</span>
    </div>
    <div id="scene">
      <div class="bg" id="sceneBg"></div>
      <div id="panel"></div>
      <div class="desk" id="desk"></div>
      <div id="robot"></div>
      <div class="bubble" id="panelBubble"></div>
      <div class="bubble" id="robotBubble"></div>
    </div>
    <div class="qcard"><span class="who" id="qwho">PAM</span><div id="qtext"></div><div class="timer" id="timer"><i id="timerBar"></i></div></div>
    <div id="answers"></div>
    <div id="tools"></div>
    <div id="picker"></div>
  </section>

  <section class="screen" id="end">
    <div class="card" id="endCard"></div>
    <div class="endbtns">
      <button class="btn" id="nextBtn" style="display:none">Next job →</button>
      <button class="btn" id="againBtn">Try again</button>
      <button class="btn pink" id="shareBtn">Share the game 🔗</button>
      <button class="btn sec" id="menuBtn">Other jobs</button>
    </div>
  </section>

  <div id="mini"></div>
  <div id="toast"></div>
</div>
<script src="barista.js"></script>
<script src="lifeguard.js"></script>
<script src="teacher.js"></script>
<script src="pilot.js"></script>
<script src="safety.js"></script>
<script src="game.js"></script>
</body>
</html>
